[package]
name = "aster-display-manager"
version = "1.0.0"
description = "ASTER Multi-Seat Display Settings Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "aster_display_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aster-display-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Devices_Display",
] }
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
