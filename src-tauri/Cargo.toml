[package]
name = "display-manager"
version = "1.1.1"
description = "Display Manager is an application which allows to manage display settings in multi user enviroment. Each user can configure their own display settings independently."
authors = ["you"]
edition = "2021"

[lib]
name = "display_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "display-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Devices_Display",
] }
winreg = "0.52"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
large_enum_variant = { level = "warn", priority = 8 }
needless_collect = { level = "deny", priority = 7 }
clone_on_copy = { level = "deny", priority = 6 }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
